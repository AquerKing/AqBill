name: bill
description: "An easy-to-use, light-weight fund tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  fl_chart: ^1.0.0
  provider: ^6.1.5
  path_provider: ^2.1.5
  flutter_logger_plus: ^5.0.0
  collection: ^1.18.0
  sqflite: ^2.3.0
  flutter_svg: ^2.0.9
  flutter_keyboard_visibility: ^6.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  archive: ^4.0.7
  flutter_datetime_picker: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/icons/
    - assets/images/
  uses-material-design: true
  generate: true
